
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrozenSV Wiki</title>
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e8f7ff;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    h1 { color: #67e8f9; }
    a { color: #67e8f9; }
    .article {
      padding: 18px;
      margin: 14px 0;
      background: #152238;
      border: 1px solid #29445e;
      border-radius: 12px;
    }
    .article h2 { margin-top: 0; }
    .muted { color: #a9bfd3; }
    button, input, textarea, select {
      box-sizing: border-box;
      width: 100%;
      margin: 7px 0;
      padding: 11px;
      border-radius: 7px;
      border: 1px solid #29445e;
      font: inherit;
    }
    button {
      background: #0891b2;
      color: white;
      cursor: pointer;
    }
    input, textarea, select {
      background: #0b1220;
      color: white;
    }
    textarea { min-height: 180px; }
    #admin { display: none; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>❄ FrozenSV Wiki</h1>
  <p class="muted">Your guide to FrozenSV Survival.</p>

  <input id="search" placeholder="Search wiki articles...">
  <section id="articles">Loading articles...</section>

  <hr>
  <p><a href="#admin" id="adminLink">Owner login</a></p>

  <section id="admin">
    <h2>Wiki Admin</h2>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Owner email" required>
      <input id="password" type="password"
             placeholder="Password" autocomplete="current-password"
             required>
      <button type="submit">Sign in</button>
    </form>

    <div id="editor" class="hidden">
      <button id="logout" type="button">Sign out</button>
      <h3 id="formTitle">Create article</h3>

      <form id="articleForm">
        <input id="title" placeholder="Article title" maxlength="120" required>
        <input id="slug" placeholder="URL slug (server-rules)"
               pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="120" required>
        <input id="category" placeholder="Category" maxlength="60" required>
        <textarea id="content" placeholder="Article content"
                  maxlength="50000" required></textarea>
        <button type="submit">Save article</button>
        <button id="newArticle" type="button">New article</button>
      </form>

      <h3>Manage articles</h3>
      <div id="manageArticles"></div>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="wiki.js"></script>
</body>
</html>
